[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket-classifier"
version = "1.0.0"
description = "Reproducible BANKING77 research and selective classification API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6", "pandas==2.2.3", "scipy==1.15.3",
  "scikit-learn==1.7.2", "joblib==1.5.2", "matplotlib==3.10.6",
  "fastapi==0.116.1", "uvicorn==0.35.0", "pydantic==2.11.7",
  "nltk==3.9.1", "psutil==7.0.0"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.13.0", "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.30.1"]
transformer = ["torch==2.8.0", "transformers==4.56.1", "accelerate==1.10.1", "datasets==4.1.1"]

[tool.setuptools.packages.find]
include = ["src*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
